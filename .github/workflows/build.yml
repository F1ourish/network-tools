name: Tests, Windows build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-converter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned tools and package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation -e .
      - name: Export candidate formatting for local review
        run: |
          mkdir -p /tmp/candidate-format
          cp -R src tests scripts packaging /tmp/candidate-format/
          python -m ruff format /tmp/candidate-format
          python - <<'PYTOOLS'
          import pathlib, shutil, site
          packages = pathlib.Path(site.getsitepackages()[0])
          destination = pathlib.Path('/tmp/candidate-format/tools')
          destination.mkdir()
          for path in packages.iterdir():
              if path.name == 'py.py' or path.name.startswith(('ruff', 'pytest', '_pytest', 'pluggy', 'iniconfig', 'packaging', 'pygments')):
                  if path.is_dir():
                      shutil.copytree(path, destination / path.name)
                  else:
                      shutil.copy2(path, destination / path.name)
          (destination / 'bin').mkdir()
          shutil.copy2(shutil.which('ruff'), destination / 'bin' / 'ruff')
          PYTOOLS
          tar -czf candidate-format.tar.gz -C /tmp/candidate-format .
      - name: Upload candidate formatting
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-format
          path: candidate-format.tar.gz
          retention-days: 3
      - name: Check Python code
        run: |
          python -m ruff check src tests scripts packaging/gui_entry.py
          python -m ruff format --check src tests scripts packaging/gui_entry.py
      - name: Test offline calculations, CLI and settings
        run: python -m pytest -q -m "not gui"

  windows-build:
    needs: unit-tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned tools and package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation -e .
      - name: Check tag against application version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_tag.py
      - name: GUI tests, PyInstaller and real EXE smoke
        run: python scripts/build_windows.py
      - name: Upload verified Windows EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MacAddressConverter-windows-x64-${{ github.ref_name }}
          path: dist/MacAddressConverter.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload portable ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MacAddressConverter-portable-${{ github.ref_name }}
          path: dist/NetworkTools-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification and screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MacAddressConverter-verification-${{ github.ref_name }}
          path: |
            dist/SHA256SUMS.txt
            dist/RELEASE_VERIFICATION.json
            smoke-results/
          if-no-files-found: error
          retention-days: 30
      - name: Upload smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MacAddressConverter-smoke-diagnostics-${{ github.run_id }}
          path: smoke-results/
          if-no-files-found: ignore
          retention-days: 7

  publish-release:
    needs: windows-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: MacAddressConverter-windows-x64-main
          path: verified/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: MacAddressConverter-portable-main
          path: verified/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: MacAddressConverter-verification-main
          path: verified
      - name: Verify assets and publish the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/publish_release.py verified/dist
