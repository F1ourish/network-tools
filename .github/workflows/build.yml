name: Tests and Windows portable build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-converter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned tools and package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation -e .
      - name: Check Python code
        run: |
          python -m ruff check src tests scripts packaging/gui_entry.py
          python -m ruff format --check src tests scripts packaging/gui_entry.py
      - name: Test conversion and CLI
        run: python -m pytest -q tests/test_mac.py tests/test_cli.py tests/test_release.py

  windows-build:
    needs: unit-tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.10"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned tools and package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation -e .
      - name: Check tag against application version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release_tag.py
      - name: GUI tests, PyInstaller and real EXE smoke
        run: python scripts/build_windows.py
      - name: Upload verified Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MacAddressConverter-windows-x64-${{ github.ref_name }}
          path: |
            dist/MacAddressConverter.exe
            dist/SHA256SUMS.txt
            smoke-results/windows-exe.json
          if-no-files-found: error
          retention-days: 30
